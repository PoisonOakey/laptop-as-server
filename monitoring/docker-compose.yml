# Image tags are pinned, not `latest`. CI validates prometheus.yml and
# alert_rules.yml with promtool from these exact versions, and `latest` would
# mean the node pulls something the checks never saw. Upgrades arrive as
# Dependabot pull requests -- see .github/dependabot.yml -- so a version bump is
# a reviewable commit rather than a silent change on the next `compose up`.
services:
  prometheus:
    image: prom/prometheus:v3.13.2
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - ./alert_rules.yml:/etc/prometheus/alert_rules.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    ports:
      - "9090:9090"
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.33.1
    container_name: alertmanager
    volumes:
      # Rendered by the Ansible monitoring role -- it carries the Discord webhook
      # and is never committed. See alertmanager/alertmanager.yml.example.
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    ports:
      - "9093:9093"
    restart: unless-stopped

  node_exporter:
    image: prom/node-exporter:v1.12.1
    container_name: node_exporter
    restart: unless-stopped
    pid: host
    # Bind-mount the host's /proc, /sys, and / so metrics reflect the VM,
    # not the node_exporter container's own tiny filesystem.
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
      # Where the acceptance role's benchmark writes stencil.prom. Mounted
      # explicitly even though /rootfs already exposes it: --path.rootfs exists
      # to strip a prefix from *filesystem* metrics, which is a different
      # mechanism, and pointing the textfile collector through it would couple
      # the two. If /rootfs were ever narrowed or removed, the metrics would stop
      # appearing with no error at all -- silent metric loss being the worst
      # failure mode a monitoring stack has.
      - /var/lib/node_exporter/textfile:/host/textfile:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
      # Publishes every .prom file in that directory alongside the built-in
      # collectors, so a benchmark result is scraped exactly like a kernel metric.
      - '--collector.textfile.directory=/host/textfile'
    ports:
      - "9100:9100"

  grafana:
    image: grafana/grafana:13.1.3
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      # Datasource and dashboard provider definitions, read on startup. Without
      # these Grafana comes up empty and needs a human to click through adding a
      # data source before any panel renders.
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      # Dashboard JSON. Mounted outside /var/lib/grafana so it does not collide
      # with the grafana_data volume.
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    restart: unless-stopped
    env_file:
      - .env

volumes:
  prometheus_data:
  grafana_data:
  alertmanager_data:
