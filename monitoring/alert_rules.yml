groups:
  - name: node
    rules:
      # Fires when a scrape target stops responding. `up` is synthesised by
      # Prometheus for every target, so this catches the exporter crashing, the
      # container stopping, and the node going away -- without needing the node
      # to report anything itself.
      - alert: TargetDown
        expr: up == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          runbook_url: "https://github.com/PoisonOakey/ztp-linux-node/blob/main/docs/RUNBOOK.md#targetdown"
          summary: "{{ $labels.job }} target is down"
          description: "{{ $labels.instance }} has failed scrapes for 2 minutes."

      # 15% free is late enough to avoid noise and early enough to act. Excludes
      # pseudo-filesystems, which are always near-full and never actionable.
      - alert: DiskSpaceLow
        expr: |
          node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"}
            / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs"} < 0.15
        for: 5m
        labels:
          severity: warning
        annotations:
          runbook_url: "https://github.com/PoisonOakey/ztp-linux-node/blob/main/docs/RUNBOOK.md#diskspacelow"
          summary: "Less than 15% disk free on {{ $labels.mountpoint }}"
          description: "{{ $labels.instance }} {{ $labels.mountpoint }} is at {{ $value | humanizePercentage }} free."

      # Predictive rather than threshold-based: a disk sitting at 80% and stable
      # needs no one woken up, whereas one filling fast does. `predict_linear`
      # extrapolates the last hour forward 24 hours.
      - alert: DiskWillFillIn24Hours
        expr: |
          predict_linear(node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"}[1h], 24 * 3600) < 0
        for: 30m
        labels:
          severity: warning
        annotations:
          runbook_url: "https://github.com/PoisonOakey/ztp-linux-node/blob/main/docs/RUNBOOK.md#diskwillfillin24hours"
          summary: "{{ $labels.mountpoint }} will fill within 24 hours"
          description: "Based on the last hour, {{ $labels.instance }} {{ $labels.mountpoint }} runs out of space within a day."

      # MemAvailable, not MemFree -- free memory excludes reclaimable cache and
      # reads alarmingly low on a healthy Linux host.
      - alert: MemoryPressure
        expr: |
          node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.10
        for: 5m
        labels:
          severity: warning
        annotations:
          runbook_url: "https://github.com/PoisonOakey/ztp-linux-node/blob/main/docs/RUNBOOK.md#memorypressure"
          summary: "Less than 10% memory available"
          description: "{{ $labels.instance }} has {{ $value | humanizePercentage }} memory available."

      # Relative to the node's own recent best, not a fixed floor -- and that is
      # the whole point of the rule.
      #
      # A fixed threshold is already covered: the acceptance gate refuses a node
      # below 12 GB/s at provisioning time, which catches gross faults like
      # memory coming up single-channel. What that cannot catch is a node which
      # passed at 16 GB/s and now manages 13.5. That is a 15% regression and
      # still comfortably above any sensible absolute floor, so only a comparison
      # against its own history sees it.
      #
      # `for: 25h` rather than minutes, because the benchmark runs on a daily
      # timer and node_exporter republishes the same value on every scrape in
      # between. A shorter window would page on a single measurement, and the
      # realistic false positive here is one run that happened to land while the
      # node was busy. Requiring the condition to hold for 25 hours means two
      # consecutive daily measurements have to agree before anyone is woken.
      #
      # Known limitation, worth stating: degradation slower than the 7-day
      # window drags the baseline down with it and never fires. Hardware that
      # decays over months is not what this catches.
      - alert: StencilThroughputRegressed
        expr: |
          stencil_bandwidth_gbytes_per_second
            / max_over_time(stencil_bandwidth_gbytes_per_second[7d]) < 0.85
        for: 25h
        labels:
          severity: warning
        annotations:
          runbook_url: "https://github.com/PoisonOakey/ztp-linux-node/blob/main/docs/RUNBOOK.md#stencilthroughputregressed"
          summary: "Memory bandwidth down more than 15% from its 7-day best"
          description: "{{ $labels.instance }} kernel {{ $labels.kernel }} is at {{ $value | humanizePercentage }} of its 7-day best."

      # Load average per core, so the threshold holds regardless of vCPU count.
      - alert: HighCpuLoad
        expr: |
          node_load15 / count without (cpu, mode) (node_cpu_seconds_total{mode="idle"}) > 2
        for: 15m
        labels:
          severity: warning
        annotations:
          runbook_url: "https://github.com/PoisonOakey/ztp-linux-node/blob/main/docs/RUNBOOK.md#highcpuload"
          summary: "15-minute load average above 2 per core"
          description: "{{ $labels.instance }} load15 is {{ $value | printf \"%.2f\" }} per core."
